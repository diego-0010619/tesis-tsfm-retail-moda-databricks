  <rect x="330" y="185" width="460" height="275" fill="#f5f5f2" stroke="#d6d3cd" stroke-width="1.8" rx="6" filter="url(#softShadow)"/>
  <text x="560" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Ingesta y preparación</text>

  <!-- 2. Pronóstico -->
  <rect x="415" y="565" width="710" height="325" fill="#f5f5f2" stroke="#d6d3cd" stroke-width="1.8" rx="6" filter="url(#softShadow)"/>
  <text x="770" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Pronóstico</text>

