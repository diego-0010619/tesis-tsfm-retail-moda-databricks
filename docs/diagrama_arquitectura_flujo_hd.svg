<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" width="100%" height="100%" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Fondo lavanda original del diagrama -->
  <rect width="1200" height="1560" fill="#efe4fb" rx="10"/>

  <!-- ================= SUBGRAFOS (CONTENEDORES) ================= -->
